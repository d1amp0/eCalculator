plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseSigningPropertiesFile = rootProject.file("key.properties")
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { stream ->
        releaseSigningProperties.load(stream)
    }
}

def requiredReleaseSigningProperties = [
    "storePassword",
    "keyPassword",
    "keyAlias",
    "storeFile",
]
def missingReleaseSigningProperties = requiredReleaseSigningProperties.findAll {
    !releaseSigningProperties.getProperty(it)?.trim()
}
def releaseSigningReady =
    releaseSigningPropertiesFile.exists() && missingReleaseSigningProperties.isEmpty()

gradle.taskGraph.whenReady { taskGraph ->
    def releaseTaskRequested = taskGraph.allTasks.any { task ->
        task.name.toLowerCase().contains("release")
    }
    if (!releaseTaskRequested) return

    if (!releaseSigningPropertiesFile.exists()) {
        throw new GradleException(
            "Release signing requires android/key.properties. " +
            "Copy android/key.properties.example and provide your local keystore settings."
        )
    }
    if (!missingReleaseSigningProperties.isEmpty()) {
        throw new GradleException(
            "android/key.properties is missing required release signing fields: " +
            missingReleaseSigningProperties.join(", ")
        )
    }
}

android {
    namespace = "com.d1amp0.ecalculator"
    compileSdk = 37
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.d1amp0.ecalculator"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // flutter_secure_storage 11.0.0 declares Android API 24 as its floor.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                keyAlias = releaseSigningProperties.getProperty("keyAlias")
                keyPassword = releaseSigningProperties.getProperty("keyPassword")
                storeFile = file(releaseSigningProperties.getProperty("storeFile"))
                storePassword = releaseSigningProperties.getProperty("storePassword")
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

flutter {
    source = "../.."
}
