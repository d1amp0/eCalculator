name: Bug report
description: Report a reproducible eCalculator problem without private data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Never include eSchool credentials, cookies, session IDs, account or
        school identifiers, grades, homework, profile data, or raw responses.
        Use synthetic examples only. Security issues belong in a private
        Security Advisory.
  - type: input
    id: version
    attributes:
      label: eCalculator version
      placeholder: 4.0.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior using synthetic or redacted data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |-
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all credentials, session material, private responses, and student/account data.
          required: true
